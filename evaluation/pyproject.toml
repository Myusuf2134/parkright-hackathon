[project]
name = "parkright-evaluation"
version = "0.1.0"
description = "Ground truth and perception scoring. Never imported by the perception path."
requires-python = ">=3.12"
dependencies = ["parkright-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parkright_evaluation"]

[tool.uv.sources]
parkright-contracts = { workspace = true }
parkright-perception = { workspace = true }
parkright-evaluation = { workspace = true }
