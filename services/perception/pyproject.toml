[project]
name = "parkright-perception"
version = "0.1.0"
description = "Frame -> PerceptionProvider -> occupancy. Never sees ground truth."
requires-python = ">=3.12"
dependencies = ["parkright-contracts", "pillow>=12,<13", "numpy>=2,<3", "shapely>=2,<3"]

[project.optional-dependencies]
ssd = ["torch>=2.6,<3", "torchvision>=0.21,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parkright_perception"]

[tool.uv.sources]
parkright-contracts = { workspace = true }
parkright-perception = { workspace = true }
parkright-evaluation = { workspace = true }
