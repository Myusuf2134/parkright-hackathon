[project]
name = "parkright-contracts"
version = "1.0.0"
description = "Canonical ParkRight wire contracts (source of truth for schema/ and ts/)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parkright_contracts"]
